services:
  agent:
    build: .
    image: iris:0.1
    ports:
      - "8080:8080"
    environment:
      AGENT_API_KEY: ${AGENT_API_KEY:?set AGENT_API_KEY}
      AGENT_API_HOST: 0.0.0.0
      AGENT_API_PORT: 8080
      AGENT_SQLITE_PATH: /app/data/agent.db
      JAVA_TOOL_OPTIONS: --enable-native-access=ALL-UNNAMED
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-ollama}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-llama3.2:3b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_TELEGRAM_ENABLED: ${AGENT_TELEGRAM_ENABLED:-false}
      AGENT_TELEGRAM_BOT_TOKEN: ${AGENT_TELEGRAM_BOT_TOKEN:-}
      AGENT_MEMORY_GRAPH_ENABLED: ${AGENT_MEMORY_GRAPH_ENABLED:-false}
      AGENT_MEMORY_GRAPH_PATH: /app/data/memory-graph
      AGENT_MEMORY_PROMPT_PATHS: ${AGENT_MEMORY_PROMPT_PATHS:-/app/data/MEMORY.md}
    volumes:
      - iris-data:/app/data

volumes:
  iris-data:
