# Kubernetes manifests for Clojure AI Agent

# 1. Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: clj-agent
  labels:
    name: clj-agent
---
# 2. ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: clj-agent-config
  namespace: clj-agent
data:
  LOG_LEVEL: "info"
  NODE_ENV: "production"
  DATABASE_URL: "postgresql://postgres:password@clj-agent-db.clj-agent.svc.cluster.local:5432/agent_db"
  REDIS_URL: "redis://clj-agent-redis.clj-agent.svc.cluster.local:6379"
---
# 3. Secret for sensitive configuration
apiVersion: v1
kind: Secret
metadata:
  name: clj-agent-secrets
  namespace: clj-agent
type: Opaque
data:
  # Base64 encoded values
  API_KEY: "YWRtaW4tc2VjcmV0LWtleQ=="  # admin-secret-key
  JWT_SECRET: "and0LXNlY3JldC1rZXk="    # jwt-secret-key
---
# 4. PostgreSQL StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clj-agent-db
  namespace: clj-agent
spec:
  serviceName: clj-agent-db
  replicas: 1
  selector:
    matchLabels:
      app: clj-agent-db
  template:
    metadata:
      labels:
        app: clj-agent-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: "agent_db"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "password"
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
# 5. PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: clj-agent-db
  namespace: clj-agent
spec:
  selector:
    app: clj-agent-db
  ports:
  - port: 5432
    targetPort: postgres
  clusterIP: None
---
# 6. Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clj-agent-redis
  namespace: clj-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clj-agent-redis
  template:
    metadata:
      labels:
        app: clj-agent-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: redis-data
        emptyDir: {}
---
# 7. Redis Service
apiVersion: v1
kind: Service
metadata:
  name: clj-agent-redis
  namespace: clj-agent
spec:
  selector:
    app: clj-agent-redis
  ports:
  - port: 6379
    targetPort: redis
---
# 8. Agent Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clj-agent
  namespace: clj-agent
  labels:
    app: clj-agent
spec:
  replicas: 3
  selector:
    matchLabels:
      app: clj-agent
  template:
    metadata:
      labels:
        app: clj-agent
    spec:
      containers:
      - name: agent
        image: clj-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: clj-agent-config
              key: LOG_LEVEL
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: clj-agent-config
              key: NODE_ENV
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: clj-agent-config
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: clj-agent-config
              key: REDIS_URL
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: clj-agent-secrets
              key: API_KEY
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: clj-agent-secrets
              key: JWT_SECRET
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
---
# 9. Agent Service
apiVersion: v1
kind: Service
metadata:
  name: clj-agent
  namespace: clj-agent
spec:
  selector:
    app: clj-agent
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  type: ClusterIP
---
# 10. Ingress (optional)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clj-agent-ingress
  namespace: clj-agent
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: agent.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: clj-agent
            port:
              number: 80
---
# 11. Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clj-agent-hpa
  namespace: clj-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clj-agent
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80