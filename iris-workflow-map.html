<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Iris — Runtime &amp; Workflow Map</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#30363d;
    --txt:#e6edf3; --dim:#8b949e; --accent:#58a6ff;
    --entry:#d29922; --transport:#a371f7; --runtime:#58a6ff; --control:#3fb950;
    --llm:#f778ba; --tool:#ff7b72; --sandbox:#db6d28; --persistence:#56d364;
    --memory:#79c0ff; --output:#8b949e; --ops:#bc8cff;
    --crit:#f85149; --high:#ff7b72; --med:#d29922; --low:#8b949e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;
    align-items:baseline;gap:16px;flex-wrap:wrap;background:var(--panel)}
  header h1{font-size:17px;margin:0;font-weight:650}
  header .sub{color:var(--dim);font-size:12.5px}
  header .hint{margin-left:auto;color:var(--dim);font-size:12px}
  #wrap{display:flex;height:calc(100% - 54px)}
  #stage{flex:1;overflow:auto;position:relative}
  svg{display:block}
  .edge{stroke:var(--line);stroke-width:1.4;fill:none;opacity:.45;transition:.15s}
  .edge.back{stroke:#6e7681;stroke-dasharray:4 3;opacity:.3}
  .edge.hl{stroke:var(--accent);opacity:1;stroke-width:2.2}
  .edge.hlback{stroke:#f778ba;opacity:1;stroke-width:2}
  .elabel{fill:var(--dim);font-size:9.5px;opacity:0;transition:.15s;pointer-events:none}
  .elabel.show{opacity:.92}
  .node{cursor:pointer}
  .node rect{stroke-width:1.5;rx:8;transition:.15s;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
  .node text.lbl{fill:var(--txt);font-size:11.5px;font-weight:600;pointer-events:none}
  .node text.file{fill:var(--dim);font-size:8.7px;pointer-events:none}
  .node.dim{opacity:.28}
  .node.sel rect{stroke:#fff;stroke-width:2.4}
  .badge circle{stroke:#0d1117;stroke-width:1.5}
  .badge text{fill:#0d1117;font-size:9px;font-weight:700;pointer-events:none}
  #panel{width:360px;min-width:360px;border-left:1px solid var(--line);
    background:var(--panel);overflow:auto;padding:0}
  #panel .ph{padding:16px 18px;border-bottom:1px solid var(--line)}
  #panel .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;padding:2px 8px;border-radius:20px;color:#0d1117}
  #panel h2{font-size:16px;margin:10px 0 4px}
  #panel .file{color:var(--accent);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
  #panel .desc{color:var(--dim);font-size:13px;margin-top:10px}
  #panel .sec{padding:14px 18px;border-bottom:1px solid var(--line)}
  #panel .sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin:0 0 10px}
  .finding{padding:9px 11px;border-radius:7px;background:var(--panel2);margin-bottom:8px;border-left:3px solid var(--low)}
  .finding.crit{border-color:var(--crit)} .finding.high{border-color:var(--high)}
  .finding.med{border-color:var(--med)} .finding.low{border-color:var(--low)}
  .finding .sv{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
  .finding.crit .sv{color:var(--crit)} .finding.high .sv{color:var(--high)}
  .finding.med .sv{color:var(--med)} .finding.low .sv{color:var(--low)}
  .finding .ti{font-size:12.5px;margin-top:2px;color:var(--txt)}
  .finding .fix{font-size:10px;color:var(--control);margin-top:3px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .flow{padding:14px 18px}
  .flow ol{margin:0;padding-left:18px} .flow li{margin-bottom:7px;color:var(--dim);font-size:12.5px}
  .flow li b{color:var(--txt)}
  .empty{color:var(--dim);font-style:italic;font-size:12.5px}
  #legend{position:absolute;top:10px;right:12px;background:rgba(22,27,34,.92);
    border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:11px}
  #legend .row{display:flex;align-items:center;gap:6px;margin:2px 0}
  #legend .sw{width:11px;height:11px;border-radius:3px}
  .stage-band{fill:#ffffff;opacity:.014}
  .stage-name{fill:#484f58;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
  .stop{fill:var(--dim);font-size:11px}
</style>
</head>
<body>
<header>
  <h1>Iris — Runtime &amp; Workflow Map</h1>
  <span class="sub">current architecture + findings · audited <code>2026-09-03</code></span>
  <span class="hint">click node → role + actionable findings · hover edge highlights flow</span>
</header>
<div id="wrap">
  <div id="stage">
    <div id="legend"></div>
    <svg id="svg"></svg>
  </div>
  <aside id="panel"></aside>
</div>

<script>
// ---- data ---------------------------------------------------------------
const TYPES = {
  entry:'Ingress', transport:'Transport', runtime:'Runtime', control:'Control',
  llm:'LLM', tool:'Tools', sandbox:'Sandbox', persistence:'Persistence',
  memory:'Memory', output:'Output', ops:'Operations'
};
// stage = vertical band (pipeline order). lane assigned automatically.
const NODES = {
  system:{l:'System lifecycle / reload',t:'control',f:'system.clj · system/components.clj',s:0,d:'Composition root builds storage, providers, broker, memory, skills, tools, chat, cron, API, and adapters. Soft reload preserves chat; full restart can persist a handoff.'},
  ops:{l:'Build / test / packaging',t:'ops',f:'Dockerfile · .github/workflows',s:0,d:'Uberjar, container, local test runner, public-history scan, and the currently disabled build/test/lint release workflow.'},
  cli:{l:'CLI / local commands',t:'entry',f:'cli.clj · cron/cli.clj',s:1,d:'Starts Iris, runs local prompts, manages config and cron jobs, and installs/enables WASM bundles.'},
  api:{l:'HTTP API + A2A',t:'entry',f:'api/routes/* · api/handlers/*',s:1,d:'Chat completions, A2A task lifecycle, sessions, cron, tools, memory, providers, events, health, and authenticated operator surfaces.'},
  tg:{l:'Telegram channel adapter',t:'entry',f:'telegram.clj · telegram/*',s:1,d:'Persistent inbox/offsets, chat-session mapping, streamed drafts, media, commands, approvals, reply keyboards, and Bot API delivery.'},
  ui:{l:'Server-rendered UI',t:'transport',f:'ui.clj · ui/{render,memory,cron}',s:1,d:'Hiccup/Datastar control plane for chat, cron, tools, approvals, memory, MAGI, events, logs, catalogue, and health.'},
  cronclock:{l:'Cron due-time trigger',t:'entry',f:'cron/schedule.clj',s:1,d:'Five-field cron, one-shot at, and UTC-anchored interval schedules provide due occurrences with explicit timezone semantics.'},
  memoryworkers:{l:'Idle memory + review workers',t:'memory',f:'memory/{idle,magi_review,user_profile}',s:1,d:'Idle extraction creates Vault candidates and learns USER.md; the MAGI worker reviews eligible notes and update/skill proposals.'},
  broker:{l:'Replayable event broker',t:'transport',f:'broker/local.clj · system/events.clj',s:2,d:'Wildcard subscriptions fan durable events to SSE, Telegram, and other consumers; bounded/drop policies rely on replay for recovery.'},
  cronservice:{l:'Persistent cron service',t:'control',f:'cron/{service,store,schedule}.clj',s:2,d:'DB-backed ticker atomically claims due jobs, creates dedicated cron sessions, snapshots execution policy, and owns recovery/health.'},
  chatrun:{l:'chat/run! + session queue',t:'runtime',f:'chat.clj · chat/{service,queue}.clj',s:2,d:'Per-session ExecutorService-backed queue serializes turns, cancellation, loop control, and persisted queued prompts.'},
  outerloop:{l:'Explicit /loop worker',t:'control',f:'loop.clj · chat/loop_control.clj',s:2,d:'A separate plan-driven worker handles /loop start/status/stop, recursively queues bounded loop turns, and is not the per-turn runtime loop.'},
  cronrunner:{l:'Cron runner + notification',t:'runtime',f:'cron/{runner,notification}.clj',s:3,d:'Runs a claimed snapshot through normal chat/run!, requires an exact final-output envelope, records outcome, then dispatches optional bound delivery.'},
  runturn:{l:'Turn composition',t:'runtime',f:'chat/turn.clj',s:3,d:'Persists input, compacts, loads history/recall/profile/skills, installs persistence and streaming subscribers, then invokes the evented runtime loop.'},
  compaction:{l:'Persisted compaction',t:'memory',f:'runtime/compaction.clj',s:4,d:'Compacts old persisted session entries above configured thresholds while preserving the active turn and recent evidence.'},
  memrecall:{l:'Hybrid memory recall',t:'memory',f:'chat/memory · memory/{recall,core,vault}',s:4,d:'Bounded recall merges SQLite message/event search with Vault FTS and optional embeddings, then emits typed provenance and a context message.'},
  prompts:{l:'Context / skills / modes',t:'memory',f:'prompts.clj · skills.clj',s:4,d:'Injects Iris context, active mode, explicitly invoked slash skills, learned profile context, and bounded memory recall.'},
  loop:{l:'Evented agent loop',t:'runtime',f:'runtime/loop.clj',s:5,d:'Repairs protocol history, packs context, routes tools, plans, applies retry/doom guards, executes directives, emits terminal state, and falls back safely.'},
  ctxpack:{l:'Context pack / evidence budget',t:'runtime',f:'runtime/context_pack.clj',s:6,d:'Drops stale nudges, retains active-turn evidence, truncates/compacts old tool results, and LLM-summarizes an older prefix when required.'},
  router:{l:'Tool schema router',t:'control',f:'runtime/tool_router.clj',s:6,d:'Selects model-visible tool schemas and returns the matching allowed-tool execution set; small-model routing can force a respond tool.'},
  guards:{l:'Nudge + doom-loop guards',t:'control',f:'runtime/{nudge,doom_loop,messages}.clj',s:6,d:'Classifies malformed/plausibly recoverable model turns, injects bounded retry guidance, and stops identical or periodic call loops.'},
  planner:{l:'Planner / directive creation',t:'control',f:'planner.clj',s:7,d:'One normalized LLM turn becomes a closed kernel step: tool-call directives, explicit response, or completion.'},
  magi:{l:'MAGI oversight',t:'control',f:'magi/{core,file_review}.clj',s:7,d:'Filter + three independent reviewers + Judge evaluate approvals and durable memory. File review is bounded/read-only; MAGI never executes the reviewed action.'},
  llm:{l:'LLM instrumentation / registry',t:'llm',f:'llm/{core,service,registry,instrumented}',s:8,d:'Resolves provider/model capabilities, applies telemetry and retry policy, normalizes content/tool calls/usage, and supports embeddings.'},
  provider:{l:'Provider transports',t:'llm',f:'llm/providers/*',s:8,d:'OpenAI-compatible chat/Responses parsing and streaming are split into focused modules; Ollama is a parallel provider implementation.'},
  kernel:{l:'Closed kernel directives',t:'control',f:'kernel/{schema,runtime,ops}.clj',s:9,d:'Normalizes a closed directive schema and dispatches consecutive tool calls through explicit ChatKernelOps.'},
  batch:{l:'Tool batch executor',t:'tool',f:'runtime/tools.clj',s:9,d:'Preflights calls, separates parallel-safe and sequential work, forces activating/approval-sensitive calls sequentially, and preserves receipt order.'},
  toolreg:{l:'Tool registry + policy',t:'tool',f:'tools/{core,service}.clj',s:10,d:'Enforces visibility, permissions, action allowlists, Malli validation, hooks, approvals, execution, redaction, telemetry, and tool events.'},
  approvals:{l:'Approval ledger',t:'control',f:'tools/approvals.clj',s:10,d:'Input-hash-bound expiring approvals preserve pending/approved/denied state across API, UI, Telegram, and optional MAGI evaluation.'},
  extreg:{l:'Skill / extension discovery',t:'tool',f:'skills.clj · wasm/bundles.clj · mcp/core.clj',s:10,d:'Loads local and bundled skills, installs/enables WASM bundles, and registers configured remote MCP tools into the common registry.'},
  builtins:{l:'Built-in tool families',t:'tool',f:'tools/common/*.clj',s:11,d:'Filesystem, shell, HTTP/web, memory, skills, todo, Telegram, Home Assistant, cron, MAGI, and direct WASM tools share one policy pipeline.'},
  wasm:{l:'WASI bundle execution',t:'sandbox',f:'wasm/bundles.clj',s:11,d:'Validated .tool/.skill archives execute with empty filesystem mounts, bounded runtime/output/memory, and declared host functions.'},
  mcp:{l:'Remote MCP tools',t:'transport',f:'mcp/core.clj',s:11,d:'Configured HTTP MCP servers initialize at registry build time; discovered tools receive stable prefixes and normal Iris policy wrappers.'},
  receipts:{l:'Receipts back to loop',t:'control',f:'kernel/runtime.clj · runtime/loop.clj',s:12,d:'Ordered receipts become assistant tool-call and tool-result protocol messages; approvals may pause, then the loop recurs or terminates.'},
  eventsink:{l:'Durable event / telemetry sink',t:'persistence',f:'system/events · telemetry/* · runtime/trace',s:13,d:'Validates and logs runtime events, records metrics/observer/trace data, then publishes them to the replayable broker.'},
  persist:{l:'SQLite state',t:'persistence',f:'persistence/sqlite.clj · sqlite/*',s:13,d:'Sessions, messages/entries, completions, events, A2A tasks, cron, approvals, todos, channel inbox, memory index, and restart handoffs.'},
  vault:{l:'Vault memory lifecycle',t:'memory',f:'memory/{core,vault,scratchpad}.clj',s:13,d:'Filesystem notes plus SQLite FTS/vector indexes support candidates, reviewed operations, project/session scope, provenance, scratchpads, and skills.'},
  health:{l:'Health / quality aggregation',t:'ops',f:'system/health.clj · memory/core.clj',s:13,d:'Aggregates component health, restart counts, scheduler state, memory quality, trace, adapters, and MCP status for /health and UI.'},
  output:{l:'SSE / API / UI / channels',t:'output',f:'api/streaming · telegram/streaming · cron/notification',s:14,d:'Returns JSON or SSE, morphs Datastar UI, finalizes Telegram drafts, replays event streams, and sends cron notifications through channel adapters.'},
};
const EDGES = [
  ['ops','system','build / package / serve'],
  ['system','api','start-server!'],['system','tg','start adapter'],['system','broker','construct'],
  ['system','cronservice','start / reload'],['system','memoryworkers','start / reload'],['system','toolreg','build registry'],['system','health','component registry'],
  ['cli','chatrun','prompt'],['cli','cronservice','cron commands'],['cli','extreg','bundle / config commands'],
  ['api','chatrun','chat + A2A task'],['api','cronservice','cron API'],['api','ui','serve /ui'],['api','broker','event SSE'],['api','health','GET /health'],['api','persist','A2A task ledger'],
  ['ui','chatrun','chat form'],['ui','cronservice','job actions'],['ui','magi','review actions'],
  ['tg','chatrun','run-chat!'],['tg','broker','subscribe stream'],
  ['cronclock','cronservice','due occurrence'],['cronservice','cronrunner','claimed run'],['cronservice','persist','jobs / runs'],
  ['cronrunner','chatrun','snapshot chat/run!'],['cronrunner','output','final envelope / notify'],
  ['memoryworkers','vault','extract / promote / profile'],['memoryworkers','magi','review candidates'],['memoryworkers','llm','note / profile extraction'],['memoryworkers','eventsink','worker events'],
  ['chatrun','outerloop','/loop control'],['outerloop','chatrun','bounded loop turns'],
  ['chatrun','runturn','run-active-item!'],
  ['runturn','compaction','auto-compact!'],
  ['runturn','memrecall','recall-memory'],['runturn','prompts','injectors'],
  ['runturn','loop','runtime-loop/run!'],
  ['loop','ctxpack','context-pack-fn'],['ctxpack','llm','summarizer-fn (LLM)'],
  ['loop','router','route-tools'],['loop','guards','pre / post verdict'],['guards','loop','retry / stop'],['loop','planner','planner-fn'],
  ['planner','prompts','planner-system prompt'],['planner','llm','llm/invoke'],
  ['llm','provider','HTTP'],['provider','loop','streamed deltas'],['llm','planner','normalized turn'],
  ['planner','loop','step + directives'],['loop','kernel','execute-step-fn'],
  ['kernel','batch','execute-agent-tool-batch!'],['batch','toolreg','preflight + execute-tool'],
  ['toolreg','approvals','approval required'],['approvals','magi','optional evaluation'],['approvals','persist','approval row'],
  ['magi','llm','Filter / reviewers / Judge'],['magi','toolreg','bounded file review'],['magi','eventsink','decision audit'],
  ['toolreg','builtins','execute-fn'],['toolreg','extreg','extension tool'],['extreg','prompts','bundled skill'],['extreg','wasm','bundle tool'],['extreg','mcp','remote tool'],
  ['builtins','receipts','tool result'],['wasm','receipts','WASI result'],['mcp','receipts','MCP result'],['batch','receipts','ordered receipts'],['receipts','loop','executed step'],
  ['loop','runturn','emit events'],['runturn','eventsink','layered emit!'],
  ['eventsink','persist','log-event!'],['eventsink','broker','publish!'],
  ['vault','persist','FTS / vectors / review state'],['broker','output','SSE / drafts / replay'],
  ['runturn','persist','messages / entries / completion'],
  ['runturn','chatrun','{:content} result'],['chatrun','output','final content'],
  ['health','output','status JSON / UI'],['api','output','JSON / SSE'],['tg','output','finalize / deliver'],
];
const STAGE_NAMES = ['Lifecycle / ops','Ingress / autonomous','Services / scheduling','Turn composition','Context / memory','Runtime loop','Budget / guardrails','Plan / review','LLM transport','Tool dispatch','Policy / extensions','Tool implementations','Return','State / observability','Delivery'];
// finding tuple: [severity, title, evidence/action] — current actionable items only.
const FIND = {
  ops:[
    ['high','Build/test/lint CI is disabled; only public-history scanning runs','Enable .github/workflows/ci-cd.yml.disabled or replace it with an active verified workflow.'],
    ['high','Default Docker command cannot start safely: 0.0.0.0 bind, no API key','Dockerfile conflicts with api/assert-api-auth-safe!; require AGENT_API_KEY or bind loopback.'],
    ['high','Configured test runner omits 4 existing test namespaces','Add MAGI core/tool, approvals, and Telegram tool-summary tests or assert discovery parity.'],
    ['med','clj-kondo is not green: 65 errors, 9 warnings','All observed errors are unresolved generated HugSQL *-sqlvec symbols; add project lint config/hooks.']],
  system:[
    ['med','Architecture entry docs still advertise removed agent.runners.*','README.md and the June codebase map need a separate current-doc refresh.']],
  health:[
    ['high','Unauthenticated /health exposes vault/trace paths and MCP endpoint URLs','Redact sensitive topology or authenticate detailed health; add a response-shape regression test.'],
    ['high','/health performs synchronous memory-quality scans over large bounded sets','Split liveness/readiness or cache/background the quality report.']],
  ui:[
    ['med','UI composition remains concentrated despite extracted render/memory/cron modules','ui.clj is 1,172 LOC and api/handlers/ui.clj is 798 LOC; keep splitting by surface ownership.']],
  cronservice:[
    ['med','A young stale run can block its job until timeout and another restart','Startup abandons stale runs once; add periodic stale reconciliation or a lease/heartbeat.']],
  ctxpack:[
    ['low','Durable evidence and tool-family retention policies remain deferred','TODO.md tracks evidence-aware compaction and browser/http/fs/shell-specific retention.']],
  llm:[
    ['low','LLM retry backoff blocks and has no jitter','llm/core.clj uses Thread.sleep with exponential delay; inject sleep/jitter for safer concurrency and tests.']],
  extreg:[
    ['med','Enabled WASM bundles are trusted and receive configured settings in stdin','Keep third-party bundles disabled until secrets move behind narrower host-owned capabilities.']],
  persist:[
    ['med','messages and session_entries remain dual rich-message sources','The deferred unification still dual-writes and merges entry overrides on reads.']],
  vault:[
    ['med','Memory ownership is concentrated in two very large modules','memory/core.clj is 1,761 LOC; memory/vault.clj is 1,013 LOC. Split only behind characterization tests.'],
    ['low','Embedding rollout still lacks the planned production measurement window','Measure recall/latency, duplicates, evidence size, acceptance, and diversity before enabling broadly.']],
};
const SEVRANK={crit:0,high:1,med:2,low:3};
const SEVCOL={crit:'var(--crit)',high:'var(--high)',med:'var(--med)',low:'var(--low)'};

// ---- layout -------------------------------------------------------------
const NW=190, NH=46, VGAP=92, TOP=40, COLW=1580;
const byStage={};
Object.entries(NODES).forEach(([id,n])=>{(byStage[n.s]=byStage[n.s]||[]).push(id);});
const maxStage=Math.max(...Object.keys(byStage).map(Number));
const pos={};
for(let s=0;s<=maxStage;s++){
  const ids=byStage[s]||[];
  const n=ids.length;
  ids.forEach((id,i)=>{
    const x = COLW*(i+1)/(n+1);
    pos[id]={x, y: TOP + s*VGAP + 30};
  });
}
const H = TOP + maxStage*VGAP + NH + 60;

// ---- render -------------------------------------------------------------
const SVGNS='http://www.w3.org/2000/svg';
const svg=document.getElementById('svg');
svg.setAttribute('viewBox',`0 0 ${COLW} ${H}`);
svg.setAttribute('width',COLW); svg.setAttribute('height',H);

// defs: arrowheads
const defs=document.createElementNS(SVGNS,'defs');
defs.innerHTML=`
 <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker>
 <marker id="arrhl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>`;
svg.appendChild(defs);

// stage bands + names
for(let s=0;s<=maxStage;s++){
  const y=TOP+s*VGAP;
  const b=document.createElementNS(SVGNS,'rect');
  b.setAttribute('class','stage-band');b.setAttribute('x',0);b.setAttribute('y',y);
  b.setAttribute('width',COLW);b.setAttribute('height',VGAP);
  if(s%2===0) svg.appendChild(b);
  const t=document.createElementNS(SVGNS,'text');
  t.setAttribute('class','stage-name');t.setAttribute('x',10);t.setAttribute('y',y+VGAP/2);
  t.textContent=STAGE_NAMES[s]||''; svg.appendChild(t);
}

// edges
const edgeEls=[];
EDGES.forEach((e,i)=>{
  const[a,b,lbl]=e; const pa=pos[a],pb=pos[b]; if(!pa||!pb)return;
  const back = NODES[b].s <= NODES[a].s;
  const x1=pa.x, y1=pa.y+NH/2, x2=pb.x, y2=pb.y-NH/2;
  const my=(y1+y2)/2;
  const path=document.createElementNS(SVGNS,'path');
  // curve: if back-edge, bow out to the side
  let d;
  if(back){
    const off = (x1+x2)/2 + (i%2?160:-160);
    d=`M${x1},${pa.y} C${off},${y1} ${off},${y2} ${x2},${pb.y}`;
  }else{
    d=`M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`;
  }
  path.setAttribute('d',d);
  path.setAttribute('class','edge'+(back?' back':''));
  path.setAttribute('marker-end','url(#arr)');
  svg.appendChild(path);
  const tl=document.createElementNS(SVGNS,'text');
  tl.setAttribute('class','elabel');
  tl.setAttribute('x',back? ((x1+x2)/2 + (i%2?150:-150)) : (x1+x2)/2);
  tl.setAttribute('y',my-2); tl.setAttribute('text-anchor','middle');
  tl.textContent=lbl; svg.appendChild(tl);
  edgeEls.push({a,b,path,label:tl,back});
});

// nodes
const nodeEls={};
Object.entries(NODES).forEach(([id,n])=>{
  const p=pos[id];
  const g=document.createElementNS(SVGNS,'g');
  g.setAttribute('class','node'); g.setAttribute('transform',`translate(${p.x-NW/2},${p.y-NH/2})`);
  const col=`var(--${n.t})`;
  const fset=FIND[id]||[];
  const worst = fset.length? fset.reduce((w,f)=>SEVRANK[f[0]]<SEVRANK[w]?f[0]:w,'low') : null;
  g.innerHTML=`
    <rect width="${NW}" height="${NH}" rx="8" fill="var(--panel2)" stroke="${col}"/>
    <rect width="4" height="${NH}" rx="2" fill="${col}"/>
    <text class="lbl" x="12" y="19">${n.l.length>26?n.l.slice(0,25)+'…':n.l}</text>
    <text class="file" x="12" y="34">${n.f}</text>`;
  if(fset.length){
    const bg=document.createElementNS(SVGNS,'g'); bg.setAttribute('class','badge');
    bg.innerHTML=`<circle cx="${NW-13}" cy="13" r="9" fill="${SEVCOL[worst]}"/>
      <text x="${NW-13}" y="16.5" text-anchor="middle">${fset.length}</text>`;
    g.appendChild(bg);
  }
  g.addEventListener('click',()=>select(id));
  g.addEventListener('mouseenter',()=>highlight(id,true));
  g.addEventListener('mouseleave',()=>{ if(!selected) highlight(null,false); });
  svg.appendChild(g); nodeEls[id]=g;
});

// legend
const lg=document.getElementById('legend');
lg.innerHTML=Object.entries(TYPES).map(([k,v])=>
  `<div class="row"><span class="sw" style="background:var(--${k})"></span>${v}</div>`).join('');

// ---- interaction --------------------------------------------------------
let selected=null;
function neighbors(id){const ins=[],outs=[];EDGES.forEach(e=>{if(e[0]===id)outs.push(e);if(e[1]===id)ins.push(e);});return{ins,outs};}
function highlight(id,showLabels){
  edgeEls.forEach(ee=>{
    const on = id && (ee.a===id||ee.b===id);
    ee.path.setAttribute('class','edge'+(ee.back?' back':'')+(on?(ee.back?' hlback':' hl'):''));
    ee.path.setAttribute('marker-end', on&&!ee.back?'url(#arrhl)':'url(#arr)');
    ee.label.classList.toggle('show', !!(on&&showLabels));
  });
  Object.entries(nodeEls).forEach(([nid,g])=>{
    const conn = id && (nid===id || EDGES.some(e=>(e[0]===id&&e[1]===nid)||(e[1]===id&&e[0]===nid)));
    g.classList.toggle('dim', !!id && !conn);
    g.classList.toggle('sel', nid===selected);
  });
}
function select(id){
  selected=id; highlight(id,true);
  const n=NODES[id]; const f=FIND[id]||[]; const {ins,outs}=neighbors(id);
  const findHtml = f.length? f.map(([sv,ti,fix])=>{
    const cls=(sv==='crit'?'crit':sv);
    const lab=(sv==='crit'?'CRITICAL':sv.toUpperCase());
    return `<div class="finding ${cls}"><div class="sv">${lab}</div><div class="ti">${ti}</div>${fix?`<div class="fix">${fix}</div>`:''}</div>`;
  }).join('') : `<div class="empty">No findings attached — clean in this review.</div>`;
  const openN=f.length;
  const flowList = `
    <div class="sec"><h3>Inbound</h3>${ins.length?ins.map(e=>`<div style="font-size:12.5px;margin:3px 0"><b style="color:var(--accent)">${NODES[e[0]].l}</b> <span style="color:var(--dim)">— ${e[2]}</span></div>`).join(''):'<div class="empty">entry point</div>'}</div>
    <div class="sec"><h3>Outbound</h3>${outs.length?outs.map(e=>`<div style="font-size:12.5px;margin:3px 0"><b style="color:var(--accent)">${NODES[e[1]].l}</b> <span style="color:var(--dim)">— ${e[2]}</span></div>`).join(''):'<div class="empty">terminal</div>'}</div>`;
  document.getElementById('panel').innerHTML=`
    <div class="ph">
      <span class="tag" style="background:var(--${n.t})">${TYPES[n.t]}</span>
      <h2>${n.l}</h2>
      <div class="file">${n.f}</div>
      <div class="desc">${n.d}</div>
    </div>
    <div class="sec"><h3>Findings (${openN} open)</h3>${findHtml}</div>
    ${flowList}`;
}
function intro(){
  selected=null; highlight(null,false);
  const counts={crit:0,high:0,med:0,low:0};
  Object.values(FIND).forEach(arr=>arr.forEach(f=>{counts[f[0]]++;}));
  document.getElementById('panel').innerHTML=`
    <div class="ph"><h2>Current runtime map</h2>
      <div class="desc">Chat + A2A, Telegram, Cron, memory workers, MAGI, MCP/WASM, persistence, observability, and delivery. Findings were re-audited against current source.</div>
    </div>
    <div class="flow"><h3 style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin:0 0 10px">Open findings</h3>
      <div class="finding high"><div class="sv">HIGH × ${counts.high}</div><div class="ti">CI/container correctness, test discovery, and health endpoint exposure/cost.</div></div>
      <div class="finding med"><div class="sv">MEDIUM × ${counts.med}</div><div class="ti">Lint baseline, stale-run recovery, documentation drift, trusted extensions, dual persistence, and ownership hotspots.</div></div>
      <div class="finding low"><div class="sv">LOW × ${counts.low}</div><div class="ti">Evidence retention, retry jitter, and measured embedding rollout.</div></div>
      <div class="desc" style="margin-top:14px"><b style="color:var(--control)">Verified now:</b> configured suite 783 tests / 3,200 assertions, 0 failures. Four omitted namespaces pass separately: 21 tests / 78 assertions.</div>
      <div class="desc" style="margin-top:12px"><b style="color:var(--high)">Lint:</b> 65 errors / 9 warnings; observed errors are unresolved generated HugSQL <code>*-sqlvec</code> symbols.</div>
      <div class="desc" style="margin-top:12px">Stale fact-graph extraction, raw chat futures, provider-monolith, missing-kernel-test, and orphan runner findings were removed.</div>
    </div>`;
}
intro();
</script>
</body>
</html>
