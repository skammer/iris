name: Tests and lint
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@12.3
        with:
          cli: '1.11.1.1347'
          clj-kondo: '2025.06.05'
      - name: Verify failed tests exit nonzero
        run: bash scripts/check-test-runner-exit.sh
      - name: Test in isolated home
        run: clojure -M:test -m agent.test-runner
      - name: Lint
        run: clj-kondo --lint src test dev/user.clj scripts/benchmark_branch_path.clj scripts/benchmark_broker.clj
